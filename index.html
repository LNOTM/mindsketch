<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MindSketch 思维画板 — 免费在线思维导图</title>
<meta name="description" content="免费、免注册、纯本地的在线思维导图工具。4 种结构、8 套主题、大纲模式；支持导出 PNG/JPG/SVG/PDF/Markdown/OPML/FreeMind/JSON/交互网页，导入 XMind/FreeMind/OPML/Markdown/TXT。">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='12' width='12' height='8' rx='2.5' fill='%233f7ef7'/%3E%3Crect x='21' y='4' width='9' height='6' rx='2' fill='%2322b07d'/%3E%3Crect x='21' y='13' width='9' height='6' rx='2' fill='%23f39c2d'/%3E%3Crect x='21' y='22' width='9' height='6' rx='2' fill='%23e85a8a'/%3E%3Cpath d='M14 16h7M21 7c-4 0-4 9-7 9M21 16h-7M21 25c-4 0-4-9-7-9' stroke='%23a7b3c7' stroke-width='1.6' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="toolbar">
    <div id="logo" title="MindSketch 思维画板">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="12" width="12" height="8" rx="2.5" fill="#3f7ef7"/><rect x="21" y="4" width="9" height="6" rx="2" fill="#22b07d"/><rect x="21" y="13" width="9" height="6" rx="2" fill="#f39c2d"/><rect x="21" y="22" width="9" height="6" rx="2" fill="#e85a8a"/><path d="M14 16h7M21 7c-4 0-4 9-7 9M21 16h-7M21 25c-4 0-4-9-7-9" stroke="#a7b3c7" stroke-width="1.6" fill="none"/></svg>
      <span>MindSketch<em>思维画板</em></span>
    </div>
    <button class="tb-icon" id="btn-undo" title="撤销 (Ctrl+Z)">↶</button>
    <button class="tb-icon" id="btn-redo" title="重做 (Ctrl+Y)">↷</button>
    <nav class="tb-menus">
      <button class="tb-btn" data-dd="file">文件</button>
      <button class="tb-btn" data-dd="edit">编辑</button>
      <button class="tb-btn" data-dd="insert">插入</button>
      <button class="tb-btn" data-dd="structure">结构</button>
      <button class="tb-btn" data-dd="theme">主题</button>
      <button class="tb-btn" id="btn-outline">大纲</button>
      <button class="tb-btn" data-dd="export">导出</button>
      <button class="tb-btn" data-dd="help">帮助</button>
    </nav>
    <div id="doc-title" title="点击重命名导图">未命名导图</div>
    <div class="tb-right">
      <button class="tb-icon" id="btn-search" title="搜索 (Ctrl+F)">⌕</button>
      <a class="tb-btn gh" href="https://github.com/LNOTM/mindsketch" target="_blank" rel="noopener" title="GitHub 仓库">GitHub</a>
    </div>
  </header>

  <main id="workspace">
    <div id="canvas-wrap">
      <div id="canvas-area">
        <svg id="link-layer" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="node-layer"></div>
        <div id="overlay-layer"></div>
      </div>
    </div>
    <aside id="outline-panel" class="hidden">
      <header><span>大纲模式</span><button id="outline-close" title="关闭">×</button></header>
      <div id="outline-body"></div>
      <footer>双击文字可直接编辑</footer>
    </aside>
    <div id="zoom-ctrl">
      <button data-zoom="out" title="缩小 (Ctrl+-)">−</button>
      <button data-zoom="reset" id="zoom-level" title="重置为 100%">100%</button>
      <button data-zoom="in" title="放大 (Ctrl+=)">＋</button>
      <button data-zoom="fit" title="适应画布 (Ctrl+Shift+F)">⛶</button>
    </div>
    <div id="search-pop" class="hidden">
      <input id="search-input" type="text" placeholder="搜索节点…" autocomplete="off">
      <span id="search-count"></span>
      <button id="search-close" title="关闭 (Esc)">×</button>
    </div>
  </main>

  <footer id="statusbar">
    <span id="status-left">就绪</span>
    <span id="status-right"></span>
  </footer>

  <div id="ctx-menu" class="menu hidden"></div>
  <div id="dropdown-root"></div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <input type="file" id="file-input" hidden accept=".json,.md,.markdown,.txt,.opml,.mm,.xmind">
</div>

<noscript><div style="padding:40px;text-align:center;font-family:sans-serif">MindSketch 需要启用 JavaScript 才能使用。</div></noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous" referrerpolicy="no-referrer" onerror="window.__noJSPDF=1"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" crossorigin="anonymous" referrerpolicy="no-referrer" onerror="window.__noJSZIP=1"></script>
<script src="js/util.js"></script>
<script src="js/model.js"></script>
<script src="js/themes.js"></script>
<script src="js/layout.js"></script>
<script src="js/io.js"></script>
<script src="js/storage.js"></script>
<script src="js/render.js"></script>
<script src="js/outline.js"></script>
<script src="js/editor.js"></script>
<script src="js/app.js"></script>
</body>
</html>
